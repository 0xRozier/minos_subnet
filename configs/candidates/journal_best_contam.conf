# journal_best + contamination_fraction_to_filter=0.05
# + threshold 65), rebuilt from the values the journal records, as validators run it:
# dont_use_soft_clipped_bases=true and max_num_haplotypes_in_population=201 are
# outside the live ranges, so the platform resets them to false / 128.
min_base_quality_score=18
min_mapping_quality_score=51
base_quality_score_threshold=18
standard_min_confidence_threshold_for_calling=65.0
emit_ref_confidence=NONE
pcr_indel_model=AGGRESSIVE
min_pruning=4
max_alternate_alleles=13
min_dangling_branch_length=20
recover_all_dangling_branches=false
max_num_haplotypes_in_population=128
adaptive_pruning_initial_error_rate=0.000182
pruning_lod_threshold=2.89
active_probability_threshold=0.002
min_assembly_region_size=98
max_assembly_region_size=394
assembly_region_padding=100
pair_hmm_gap_continuation_penalty=15
phred_scaled_global_read_mismapping_rate=28
heterozygosity=0.007
indel_heterozygosity=0.000417
sample_ploidy=2
contamination_fraction_to_filter=0.05
max_reads_per_alignment_start=32
dont_use_soft_clipped_bases=false
